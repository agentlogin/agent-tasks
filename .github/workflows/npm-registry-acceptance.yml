name: npm registry acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      publication_confirmed:
        description: All nine exact beta versions are published and their original artifact integrities verified
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: npm-registry-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_confirmed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Verify original public release manifests and prepare isolated consumer
        id: prepare
        env:
          PUBLICATION_CONFIRMED: ${{ inputs.publication_confirmed }}
        run: node scripts/registry-acceptance/prepare.mjs
      - name: Resolve exact npm versions without scripts or npm credentials
        id: lock
        working-directory: ${{ steps.prepare.outputs.consumer }}
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 \
            NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_GLOBALCONFIG='${{ steps.prepare.outputs.globalConfig }}' \
            NPM_CONFIG_CACHE='${{ steps.prepare.outputs.cache }}' NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_GIT=/usr/bin/false \
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reject foreign sources and artifact substitutions before installation
        id: verify
        working-directory: ${{ steps.prepare.outputs.consumer }}
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {verifyLock} from './scripts/verify-lock.mjs'; const j=p=>JSON.parse(readFileSync(p,'utf8')); console.log(JSON.stringify(verifyLock(j('package.json'),j('package-lock.json'),j('expected-registry-release.json'))));"
      - name: Install all nine published packages from an empty tarball cache
        id: install
        working-directory: ${{ steps.prepare.outputs.consumer }}
        env:
          ACCEPTANCE_CACHE: ${{ steps.prepare.outputs.cache }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {rmSync,mkdirSync} from 'node:fs'; import {resolve} from 'node:path'; const p=resolve(process.env.ACCEPTANCE_CACHE); assert.ok(p.startsWith(resolve(process.env.RUNNER_TEMP)+'/agentlogin-npm-acceptance-')); assert.ok(p.endsWith('/cache')); rmSync(p,{recursive:true,force:true}); mkdirSync(p,{mode:0o700});"
          env -i PATH="$PATH" LANG=C.UTF-8 \
            NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_GLOBALCONFIG='${{ steps.prepare.outputs.globalConfig }}' \
            NPM_CONFIG_CACHE='${{ steps.prepare.outputs.cache }}' NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_GIT=/usr/bin/false \
            npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed imports, CLI help and actual MCP inventories
        id: smoke
        working-directory: ${{ steps.prepare.outputs.consumer }}
        run: node registry-smoke.mjs | tee '${{ steps.prepare.outputs.evidence }}/package-and-mcp-smoke.log'
      - name: Run unchanged behavioral tests and six registry distribution checks
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ steps.prepare.outputs.consumer }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/postgres
          REQUIRE_POSTGRES_TESTS: '1'
        run: node --test --test-concurrency=1 test/*.test.mjs | tee '${{ steps.prepare.outputs.evidence }}/agent-tasks-tests.tap'
      - name: Audit the complete installed dependency graph
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ steps.prepare.outputs.consumer }}
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 \
            NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_GLOBALCONFIG='${{ steps.prepare.outputs.globalConfig }}' \
            NPM_CONFIG_CACHE='${{ steps.prepare.outputs.cache }}' NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ NPM_CONFIG_GIT=/usr/bin/false \
            npm audit --json --audit-level=low > '${{ steps.prepare.outputs.evidence }}/dependency-audit.json'
      - name: Preserve evidence and require every acceptance check
        if: always()
        env:
          ACCEPTANCE_CONSUMER: ${{ steps.prepare.outputs.consumer }}
          ACCEPTANCE_EVIDENCE: ${{ github.workspace }}/evidence/npm-registry-acceptance
          ACCEPTANCE_STEP_OUTCOMES: >-
            {"prepare":"${{ steps.prepare.outcome }}","lock":"${{ steps.lock.outcome }}","verify":"${{ steps.verify.outcome }}","install":"${{ steps.install.outcome }}","smoke":"${{ steps.smoke.outcome }}","tests":"${{ steps.tests.outcome }}","audit":"${{ steps.audit.outcome }}"}
        run: node scripts/registry-acceptance/verify-result.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-registry-acceptance-${{ github.sha }}
          path: evidence/npm-registry-acceptance/
          if-no-files-found: warn
