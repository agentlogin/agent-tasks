name: Agent Tasks acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tasks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/postgres
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Verify public distribution lock
        run: node scripts/verify-lock.mjs
      - name: Install from an empty public-only cache
        run: npm ci --ignore-scripts --cache "$RUNNER_TEMP/agent-tasks-empty-cache" --userconfig /dev/null --registry=https://registry.npmjs.org/
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=low --userconfig /dev/null --registry=https://registry.npmjs.org/ --json > production-audit.json
      - name: Test PostgreSQL, protocol and adversarial schedules
        run: npm test | tee acceptance.tap
      - name: Build the frozen production dependency image
        run: docker build --pull --tag agent-tasks:ci .
      - name: Verify nonroot image, migration grants, readiness and shutdown
        run: node scripts/container-smoke.mjs --image agent-tasks:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-tasks-acceptance-${{ github.sha }}
          path: |
            acceptance.tap
            production-audit.json
            container-smoke.json
          if-no-files-found: warn
